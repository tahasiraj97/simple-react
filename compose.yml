name: insert-name-here
services: 
  reverse_proxy:
    image: nginx:trixie
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: [5000:80]
  frontend:
    image: node:22-trixie-slim
    working_dir: /app
    volumes: [./frontend:/app]
    command: ["sh", "-c", "npm install && npm run dev"]

